<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">✦</span>
          <span>Support Assistant</span>
        </div>
        <span id="status" class="status" title="Checking server…"></span>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <section id="welcome" class="welcome">
          <h1>How can I help?</h1>
          <p>Describe the customer's issue and I'll suggest a response.</p>
          <div class="suggestions">
            <button type="button" class="suggestion">My internet keeps disconnecting.</button>
            <button type="button" class="suggestion">I cannot make a payment.</button>
            <button type="button" class="suggestion">My internet is extremely slow.</button>
            <button type="button" class="suggestion">I cannot log in to my account.</button>
          </div>
        </section>
      </main>

      <form id="composer" class="composer">
        <div class="composer-box">
          <textarea
            id="input"
            rows="1"
            maxlength="1000"
            placeholder="Message Support Assistant…"
            aria-label="Message"
          ></textarea>
          <button type="submit" id="send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
